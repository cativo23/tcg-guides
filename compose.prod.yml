name: tcg-guides-prod

services:
  app:
    image: ${DOCKER_USERNAME:-cativo23}/tcg-guides:latest
    restart: unless-stopped
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "--tries=1", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tcg-guides.rule=Host(`tcg.cativo.dev`)"
      - "traefik.http.routers.tcg-guides.entrypoints=websecure"
      - "traefik.http.routers.tcg-guides.tls.certresolver=letsencryptresolver"
      - "traefik.http.routers.tcg-guides.middlewares=security-headers@file"
      - "traefik.http.services.tcg-guides.loadbalancer.server.port=80"
    networks:
      - space-server_web

networks:
  space-server_web:
    external: true
